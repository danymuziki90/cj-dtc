name: Apply Prisma migrations

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      recover_failed_submission_migration:
        description: Recover the previously failed submission migration before applying migrations
        required: false
        default: false
        type: boolean

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Recover failed submission migration
        if: ${{ inputs.recover_failed_submission_migration }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate resolve --rolled-back 20260724220000_submission_unique_per_assignment

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Verify migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate status --schema=prisma/schema.prisma
