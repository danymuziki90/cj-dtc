name: Apply Prisma migrations

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      recover_failed_migration:
        description: Failed migration name to recover before applying migrations (leave blank normally)
        required: false
        default: ''
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Recover an explicitly approved failed migration
        if: ${{ inputs.recover_failed_migration != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_NAME: ${{ inputs.recover_failed_migration }}
        run: |
          case "$MIGRATION_NAME" in
            20260724220000_submission_unique_per_assignment|20260814120000_hero_carousel_controls)
              npx prisma migrate resolve --rolled-back "$MIGRATION_NAME"
              ;;
            *)
              echo "Unsupported migration recovery request: $MIGRATION_NAME"
              exit 1
              ;;
          esac

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Verify migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate status --schema=prisma/schema.prisma
